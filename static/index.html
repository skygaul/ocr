<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OCR 표 변환</title>
<script src="/static/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600&family=Source+Serif+4:wght@400;600&display=swap">
<link rel="stylesheet" href="/static/app.css">
<style>
  .page { display: grid; gap: var(--s4); grid-template-columns: minmax(0, 1fr) 280px; align-items: start; }
  .page > * { min-width: 0; }
  .stack { display: grid; gap: var(--s4); }
  #drop { display: block; border: 2px dashed var(--line); border-radius: var(--radius); padding: var(--s5) var(--s4); text-align: center; color: var(--mute); cursor: pointer; background: var(--surface-2); }
  #drop:hover, #drop.over { border-color: var(--accent); color: var(--accent); }
  #drop strong { color: var(--fg); display: block; margin-bottom: 2px; }
  #file { position: absolute; width: 1px; height: 1px; opacity: 0; }
  #file:focus-visible + #drop { outline: 2px solid var(--accent); outline-offset: 2px; }
  .progress { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: var(--s3); }
  .progress i { display: block; height: 100%; width: 35%; background: var(--accent); animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
  .empty { text-align: center; padding: var(--s6) var(--s4); color: var(--mute); }
  .empty h2 { color: var(--fg); font-size: var(--fs-lg); text-transform: none; letter-spacing: 0; margin-bottom: var(--s2); }
  .err { border-color: var(--st-needs_check); }
  .err b { color: var(--st-needs_check); }
  .head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s4); margin-bottom: var(--s3); }
  .head h2 { margin: 0; font-size: var(--fs-sm); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--mute); }
  .head .row { margin-left: auto; }
  .two { display: grid; gap: var(--s4); grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  details > summary { cursor: pointer; font-size: var(--fs-sm); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--mute); }
  details[open] > summary { margin-bottom: var(--s2); }
  #text { width: 100%; min-height: 260px; font: 13px/1.5 var(--font-mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px; resize: vertical; color: var(--fg); }
  ul.hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  ul.hist li { display: flex; align-items: center; gap: var(--s2); border-radius: 6px; }
  ul.hist li:hover { background: var(--surface-2); }
  ul.hist .open { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 6px 8px; cursor: pointer; }
  ul.hist .open b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  ul.hist .x { background: none; border: 0; color: var(--mute); cursor: pointer; padding: 6px 8px; border-radius: 6px; }
  ul.hist .x:hover { color: var(--st-needs_check); }
  @media (max-width: 1100px) { .page { grid-template-columns: minmax(0, 1fr); } .two { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 760px) {
    table.rt { font-size: 12px; } table.rt td, table.rt thead th { padding: 3px 5px; }
    .head .row { margin-left: 0; }
  }
</style>
</head>
<body>
<header class="top">
  <h1>OCR 표 변환</h1>
  <nav aria-label="화면">
    <a href="/" aria-current="page">업로드</a>
    <a href="/review?table=census">검토: Census Table 1</a>
    <a href="/review?table=fraser">검토: FRASER No. 11</a>
  </nav>
  <span class="spacer"></span>
  <button id="theme-btn" class="btn theme-btn" type="button"></button>
</header>

<div class="wrap">
  <div class="page">
    <div class="stack">
      <section class="panel" aria-label="이미지 올리기">
        <input id="file" type="file" accept="image/*">
        <label id="drop" for="file"><strong>표 이미지를 끌어다 놓거나 눌러서 선택</strong>PNG · JPG · WEBP · 붙여넣기(Ctrl+V)도 됩니다</label>
        <div class="row" style="margin-top:12px">
          <label class="muted" for="lang">언어</label>
          <select id="lang">
            <option value="en">영어 (표·숫자)</option>
            <option value="korean">한국어 + 영어</option>
          </select>
          <button id="run" class="btn primary" type="button" disabled>표로 변환</button>
          <span id="status" class="muted" role="status" aria-live="polite"></span>
        </div>
        <div class="progress" id="prog" hidden><i></i></div>
      </section>

      <section class="panel empty" id="empty">
        <h2>표를 올리면 여기에 복원됩니다</h2>
        <p>글자와 좌표를 읽어 행·열을 맞추고, TXT · JSON · XLSX · CSV로 내려받을 수 있습니다.<br>
        결과는 자동 저장되며, 칸 단위 검토는 <a href="/review?table=census">검토 화면</a>에서 합니다.</p>
      </section>
      <section class="panel err" id="err" hidden><b>변환하지 못했습니다.</b> <span id="errmsg"></span></section>

      <section id="out" class="stack" hidden>
        <div class="panel">
          <div class="head">
            <h2>복원된 표</h2>
            <div class="row">
              <a id="dxlsx" class="btn primary">XLSX</a>
              <a id="dcsv" class="btn">CSV</a>
              <a id="dtxt" class="btn">TXT</a>
              <a id="djson" class="btn">JSON</a>
            </div>
          </div>
          <div class="scroll-x"><table class="rt" id="tbl"></table></div>
          <div class="notes" id="notes"></div>
          <div class="muted" id="meta" style="margin-top:8px;font-size:12px"></div>
        </div>
        <div class="two">
          <div class="panel">
            <h2>원본과 인식 영역</h2>
            <div class="imgwrap"><img id="img" alt="업로드한 원본 이미지"><svg id="ov" aria-hidden="true"></svg></div>
          </div>
          <div class="panel">
            <details>
              <summary>추출된 텍스트 (수정 가능)</summary>
              <textarea id="text" aria-label="추출된 텍스트"></textarea>
              <div class="row" style="margin-top:8px"><button class="btn" id="copy" type="button">복사</button></div>
            </details>
          </div>
        </div>
      </section>
    </div>

    <aside class="panel" aria-label="저장된 결과">
      <h2>저장된 결과</h2>
      <ul class="hist" id="hist"></ul>
    </aside>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let file = null, timer = null;
const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[ch]));
const isNum = s => /^[\d][\d,.\s]*$/.test(String(s).trim());

/* ---------- 입력 ---------- */
const drop = $('drop');
$('file').onchange = e => setFile(e.target.files[0]);
['dragover', 'dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => setFile(e.dataTransfer.files[0]));
window.addEventListener('paste', e => { const f = [...e.clipboardData.files].find(f => f.type.startsWith('image/')); if (f) setFile(f); });
function setFile(f) {
  if (!f) return;
  file = f;
  drop.innerHTML = `<strong>${esc(f.name)}</strong>${(f.size / 1024).toFixed(0)} KB · 다른 파일을 고르려면 다시 누르세요`;
  $('run').disabled = false; $('status').textContent = '';
}

/* ---------- 실행 ---------- */
$('run').onclick = async () => {
  if (!file) return;
  $('run').disabled = true; $('err').hidden = true; $('prog').hidden = false;
  const t0 = Date.now();
  timer = setInterval(() => { $('status').textContent = `인식 중… ${Math.round((Date.now() - t0) / 1000)}초 (처음 한 번은 모델을 불러오느라 오래 걸립니다)`; }, 500);
  const fd = new FormData(); fd.append('image', file); fd.append('lang', $('lang').value);
  try {
    const r = await fetch('/api/ocr', {method: 'POST', body: fd});
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || '서버 오류');
    show(d); $('status').textContent = `완료 · ${((Date.now() - t0) / 1000).toFixed(1)}초 · 자동 저장됨`;
    loadHist();
  } catch (e) {
    $('status').textContent = ''; $('errmsg').textContent = e.message; $('err').hidden = false;
  } finally {
    clearInterval(timer); $('prog').hidden = true; $('run').disabled = false;
  }
};

/* ---------- 결과 ---------- */
function show(d) {
  $('empty').hidden = true; $('out').hidden = false; $('err').hidden = true;
  renderTable(d.table); history.replaceState(null, '', '#' + d.id);
  const img = $('img');
  img.onload = () => {
    $('ov').setAttribute('viewBox', `0 0 ${img.naturalWidth} ${img.naturalHeight}`);
    $('ov').innerHTML = d.lines.map(l => `<polygon points="${l.box.map(p => p.join(',')).join(' ')}" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2"><title>${esc(l.text)} (${(l.score * 100).toFixed(0)}%)</title></polygon>`).join('');
  };
  img.src = '/uploads/' + d.image;
  $('text').value = d.text;
  $('dtxt').href = `/download/${d.id}.txt`; $('djson').href = `/download/${d.id}.json`;
  $('dxlsx').href = `/download/${d.id}.xlsx`; $('dcsv').href = `/download/${d.id}.csv`;
  const avg = d.lines.length ? d.lines.reduce((a, l) => a + l.score, 0) / d.lines.length : 0;
  $('meta').textContent = `${d.filename} · ${d.lines.length}줄 · 평균 신뢰도 ${(avg * 100).toFixed(1)}% · ID ${d.id}`;
}

function renderTable(tb) {
  const spans = tb.spans || [], hdr = tb.header[0] || [];
  const covered = k => spans.some(s => s.c0 <= k && k <= s.c1);
  let h = '';
  if (tb.caption && tb.caption.length) h += '<caption>' + tb.caption.map(l => `<div>${esc(l)}</div>`).join('') + '</caption>';
  h += '<thead>';
  if (spans.length) {
    let r1 = '', r2 = '';
    hdr.forEach((c, k) => {
      const sp = spans.find(s => s.c0 === k);
      if (sp) r1 += `<th colspan="${sp.c1 - sp.c0 + 1}">${esc(sp.text)}</th>`;
      else if (!covered(k)) r1 += `<th rowspan="2">${esc(c.text)}</th>`;
      if (covered(k)) r2 += `<th>${esc(c.text)}</th>`;
    });
    h += `<tr>${r1}</tr><tr>${r2}</tr>`;
  } else if (hdr.length) {
    h += '<tr>' + hdr.map(c => `<th>${esc(c.text)}</th>`).join('') + '</tr>';
  }
  h += '</thead><tbody>';
  for (const row of tb.rows) {
    if (row.slice(1).every(c => !c.text)) {  // 구역 소제목 행: 값이 없으면 점선 리더 없이 굵게
      h += `<tr><td class="sec" colspan="${row.length}">${esc(row[0].text)}</td></tr>`; continue;
    }
    h += '<tr>';
    row.forEach((c, k) => {
      const t = String(c.text), num = c.num || isNum(t);
      if (k === 0) h += `<td style="padding-left:${10 + c.indent * 0.5}px"><span class="lab"><span class="lt">${esc(t)}</span><span class="lead"></span></span></td>`;
      else h += `<td class="${num ? 'num' : ''}">${esc(num ? t.replace(/,\s+/g, ',') : t)}</td>`;
    });
    h += '</tr>';
  }
  h += '</tbody>';
  $('tbl').innerHTML = h;
  $('notes').innerHTML = [...(tb.notes || []).map(n => `<div>${esc(n)}</div>`),
                          ...(tb.warnings || []).map(w => `<div class="warn">⚠ ${esc(w)}</div>`)].join('');
}

$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText($('text').value); $('status').textContent = '복사했습니다'; }
  catch { $('text').select(); $('status').textContent = '선택했습니다. Ctrl+C로 복사하세요'; }
};

/* ---------- 기록 ---------- */
async function loadHist() {
  const items = await (await fetch('/api/results')).json();
  const ul = $('hist'); ul.textContent = '';
  if (!items.length) { ul.innerHTML = '<li class="muted" style="padding:6px 8px">아직 저장된 결과가 없습니다.</li>'; return; }
  for (const it of items) {
    const li = document.createElement('li');
    li.innerHTML = `<button class="open" type="button"><b>${esc(it.filename)}</b><span class="muted" style="font-size:12px">${esc(it.created.replace('T', ' '))} · ${it.chars}자</span></button><button class="x" type="button" aria-label="삭제" title="삭제">✕</button>`;
    li.querySelector('.open').onclick = async () => show(await (await fetch('/api/results/' + it.id)).json());
    li.querySelector('.x').onclick = async () => {
      if (!confirm('이 결과를 삭제할까요?')) return;
      await fetch('/api/results/' + it.id, {method: 'DELETE'}); loadHist();
    };
    ul.append(li);
  }
}
loadHist();
if (location.hash.length > 1) fetch('/api/results/' + location.hash.slice(1)).then(r => r.ok ? r.json() : null).then(d => d && show(d));
</script>
</body>
</html>
